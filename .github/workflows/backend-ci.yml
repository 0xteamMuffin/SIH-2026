name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".dockerignore"
      - "docker-compose*.yml"
      - ".env.example"
      - "ops/qdrant-snapshot.mjs"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".dockerignore"
      - "docker-compose*.yml"
      - ".env.example"
      - "ops/qdrant-snapshot.mjs"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      CI: "true"
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install prisma generate
      - run: npx --no-install prisma validate
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: node --check ../ops/qdrant-snapshot.mjs

  sandbox-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/sandbox-runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: backend/sandbox-runner/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.sovereign.yml config --quiet

  container-builds:
    needs: [backend, sandbox-runner, compose]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --tag sih-backend-ci ./backend
      - run: docker build --tag sih-sandbox-runner-ci ./backend/sandbox-runner
