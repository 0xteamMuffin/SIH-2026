name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".dockerignore"
      - "docker-compose*.yml"
      - ".env.example"
      - "ops/**"
      - "docs/ARCHITECTURE.md"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".dockerignore"
      - "docker-compose*.yml"
      - ".env.example"
      - "ops/**"
      - "docs/ARCHITECTURE.md"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      CI: "true"
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install prisma generate
      - run: npx --no-install prisma validate
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: node --check ../ops/qdrant-snapshot.mjs

  sandbox-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/sandbox-runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: backend/sandbox-runner/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker compose --env-file .env.example config --quiet
      - run: node ops/verify-sovereign-compose.mjs

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: sih_migration_test
          POSTGRES_USER: migration_test
          POSTGRES_PASSWORD: migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migration_test -d sih_migration_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      MIGRATION_TEST_DATABASE_URL: postgresql://migration_test:migration_test@localhost:5432/sih_migration_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install prisma generate
      - run: npm run test:migrations

  backend-acceptance:
    needs: [backend, sandbox-runner, compose, migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Pull sandbox runtime
        run: |
          docker pull node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
          docker pull python:3.13-alpine@sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d
      - name: Start disposable sovereign backend
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.sovereign.yml -f ops/docker-compose.acceptance.yml up --build --detach --wait --wait-timeout 240 postgres minio minio-init qdrant rabbitmq sandbox-runner backend worker
      - name: Run backend acceptance
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.sovereign.yml -f ops/docker-compose.acceptance.yml run --build --rm acceptance
      - name: Show container logs on failure
        if: failure()
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.sovereign.yml -f ops/docker-compose.acceptance.yml logs --no-color
      - name: Stop disposable backend
        if: always()
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.sovereign.yml -f ops/docker-compose.acceptance.yml down --volumes --remove-orphans

  container-builds:
    needs: [backend, sandbox-runner, compose, migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --tag sih-backend-ci ./backend
      - run: docker build --tag sih-sandbox-runner-ci ./backend/sandbox-runner
