# Local hot-reload override. Bind-mounts source into the containers and runs
# each service's dev script (tsx watch / next dev) instead of the built output.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Not for sovereign/production use — dev images keep devDependencies and run
# as root for bind-mount convenience.
services:
  backend:
    # The Electron client runs on the host, not in the compose network, so the
    # API has to be reachable from outside. `internal` is a closed network and
    # cannot publish, so the backend joins `edge` as well — the same pattern
    # the frontend already uses for its browser port.
    #
    # Deliberately dev-only. The sovereign stack publishes nothing and keeps
    # the backend on `internal` alone.
    ports: ["4000:4000"]
    networks: [internal, edge]
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: ["sh", "-c", "npx --no-install prisma generate && npx --no-install prisma migrate deploy && npm run dev"]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
      - worker_node_modules:/app/node_modules
    command: ["sh", "-c", "npx --no-install prisma generate && npx --no-install prisma migrate deploy && npm run dev:worker"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    command: ["npm", "run", "dev"]

volumes:
  backend_node_modules:
  worker_node_modules:
  frontend_node_modules:
  frontend_next:
