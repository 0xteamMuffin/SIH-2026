x-backend-env: !reset null

services:
  minio:
    ports: !reset []
  backend:
    # The sovereign stack publishes nothing: no host port, and no `edge`
    # membership that would give the API outside reachability.
    ports: !reset []
    networks: !override [internal]
    environment:
      APP_MODE: sovereign
      ALLOW_REMOTE_INFERENCE: "false"
      REMOTE_MODEL_API_KEY: !reset null
      GROQ_API_KEY: !reset null
      GEMINI_API_KEY: !reset null
      MISTRAL_API_KEY: !reset null
      CLOUDFLARE_API_TOKEN: !reset null
      CLOUDFLARE_AI_BASE_URL: !reset null
  worker:
    networks: !override [internal]
    extra_hosts: !reset []
    environment:
      APP_MODE: sovereign
      ALLOW_REMOTE_INFERENCE: "false"
      REMOTE_MODEL_API_KEY: !reset null
      GROQ_API_KEY: !reset null
      GEMINI_API_KEY: !reset null
      MISTRAL_API_KEY: !reset null
      CLOUDFLARE_API_TOKEN: !reset null
      CLOUDFLARE_AI_BASE_URL: !reset null

networks:
  internal:
    internal: true
  edge: {}
