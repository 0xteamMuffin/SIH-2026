name: sih-2026

x-backend-env: &backend-env
  NODE_ENV: production
  API_PORT: 4000
  DATABASE_URL: ${DATABASE_URL}
  JWT_SECRET: ${JWT_SECRET}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_REGION: ${S3_REGION}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  MINIO_BUCKET: ${MINIO_BUCKET}
  QDRANT_URL: ${QDRANT_URL}
  SANDBOX_RUNNER_URL: http://sandbox-runner:4100
  APP_MODE: ${APP_MODE}
  MODEL_PROVIDER: ${MODEL_PROVIDER}
  MODEL_REGISTRY_JSON: ${MODEL_REGISTRY_JSON:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL}
  LOCAL_MODEL_BASE_URL: ${LOCAL_MODEL_BASE_URL}
  LOCAL_MODEL_API_KEY: ${LOCAL_MODEL_API_KEY}
  LOCAL_GENERAL_MODEL: ${LOCAL_GENERAL_MODEL}
  LOCAL_VISION_MODEL: ${LOCAL_VISION_MODEL}
  LOCAL_CODE_MODEL: ${LOCAL_CODE_MODEL}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [minio_data:/data]
    ports: ["9001:9001"]
    networks: [internal]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do sleep 2; done
        mc mb --ignore-existing local/${MINIO_BUCKET}
        mc anonymous set none local/${MINIO_BUCKET}
    networks: [internal]

  qdrant:
    image: qdrant/qdrant:v1.13.4
    volumes: [qdrant_data:/qdrant/storage]
    networks: [internal]

  sandbox-runner:
    build: ./backend/sandbox-runner
    environment:
      SANDBOX_IMAGE: node:22-alpine
      SANDBOX_TIMEOUT_MS: 30000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sandbox_workspaces:/workspaces
    networks: [internal]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]

  backend:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      qdrant: { condition: service_started }
      sandbox-runner: { condition: service_started }
    environment: *backend-env
    ports: ["4000:4000"]
    # Development adapter only: this is the sole app service with egress.
    # docker-compose.sovereign.yml removes this network.
    networks: [internal, development-egress]

  frontend:
    build: ./frontend
    depends_on: [backend]
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports: ["3000:3000"]
    # The UI needs an ingress network so its published browser port works.
    # It has no direct credentials for internal data services.
    networks: [internal, edge]

networks:
  internal:
    internal: true
  development-egress: {}
  edge: {}

volumes:
  postgres_data:
  minio_data:
  qdrant_data:
  sandbox_workspaces:
