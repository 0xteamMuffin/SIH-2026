name: sih-2026

x-backend-env: &backend-env
  NODE_ENV: production
  API_PORT: 4000
  LOG_LEVEL: ${LOG_LEVEL:-info}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
  TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
  API_RATE_LIMIT_WINDOW_MS: ${API_RATE_LIMIT_WINDOW_MS:-60000}
  API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-1000}
  LOGIN_RATE_LIMIT_WINDOW_MS: ${LOGIN_RATE_LIMIT_WINDOW_MS:-900000}
  LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-10}
  READINESS_TIMEOUT_MS: ${READINESS_TIMEOUT_MS:-3000}
  DOCLING_REQUIRED: ${DOCLING_REQUIRED:-false}
  DATABASE_URL: ${DATABASE_URL}
  JWT_SECRET: ${JWT_SECRET}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_REGION: ${S3_REGION}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  MINIO_BUCKET: ${MINIO_BUCKET}
  QDRANT_URL: ${QDRANT_URL}
  QDRANT_API_KEY: ${QDRANT_API_KEY:-local-development-qdrant-key-change-me}
  SANDBOX_RUNNER_URL: http://sandbox-runner:4100
  SANDBOX_API_TOKEN: ${SANDBOX_API_TOKEN:-local-development-sandbox-token-change-me}
  PDF_RENDERER_URL: http://pdf-renderer:4200
  PDF_RENDERER_API_TOKEN: ${PDF_RENDERER_API_TOKEN:-local-development-pdf-renderer-token-change-me}
  PDF_RENDER_TIMEOUT_MS: ${PDF_RENDER_TIMEOUT_MS:-30000}
  PDF_RENDER_MAX_SOURCE_BYTES: ${PDF_RENDER_MAX_SOURCE_BYTES:-26214400}
  PDF_RENDER_MAX_PAGES: ${PDF_RENDER_MAX_PAGES:-3}
  PDF_RENDER_DPI: ${PDF_RENDER_DPI:-144}
  PDF_RENDER_MAX_PIXELS_PER_PAGE: ${PDF_RENDER_MAX_PIXELS_PER_PAGE:-4000000}
  PDF_RENDER_MAX_TOTAL_BYTES: ${PDF_RENDER_MAX_TOTAL_BYTES:-10485760}
  AMQP_URL: ${AMQP_URL}
  APP_MODE: ${APP_MODE}
  MODEL_CONFIG_PATH: /app/config/models.json
  ALLOW_REMOTE_INFERENCE: ${ALLOW_REMOTE_INFERENCE:-false}
  MODEL_REQUEST_TIMEOUT_MS: ${MODEL_REQUEST_TIMEOUT_MS:-120000}
  VISION_MAX_IMAGE_BYTES: ${VISION_MAX_IMAGE_BYTES:-10485760}
  REMOTE_MODEL_API_KEY: ${REMOTE_MODEL_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
  CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
  CLOUDFLARE_AI_BASE_URL: ${CLOUDFLARE_AI_BASE_URL:-}
  QUEUE_PREFETCH: ${QUEUE_PREFETCH:-1}
  QUEUE_MAX_RETRIES: ${QUEUE_MAX_RETRIES:-3}
  QUEUE_RETRY_DELAY_MS: ${QUEUE_RETRY_DELAY_MS:-15000}
  KNOWLEDGE_QUEUE_PREFETCH: ${KNOWLEDGE_QUEUE_PREFETCH:-1}
  KNOWLEDGE_QUEUE_MAX_RETRIES: ${KNOWLEDGE_QUEUE_MAX_RETRIES:-3}
  KNOWLEDGE_QUEUE_RETRY_DELAY_MS: ${KNOWLEDGE_QUEUE_RETRY_DELAY_MS:-15000}
  KNOWLEDGE_RECONCILIATION_INTERVAL_MS: ${KNOWLEDGE_RECONCILIATION_INTERVAL_MS:-300000}
  OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}
  OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-25}
  OUTBOX_MAX_BACKOFF_MS: ${OUTBOX_MAX_BACKOFF_MS:-60000}
  WORKER_SHUTDOWN_TIMEOUT_MS: ${WORKER_SHUTDOWN_TIMEOUT_MS:-30000}
  RUN_LEASE_DURATION_MS: ${RUN_LEASE_DURATION_MS:-30000}
  AGENT_MAX_TURNS: ${AGENT_MAX_TURNS:-4}
  AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-5}
  AGENT_MAX_INPUT_TOKENS: ${AGENT_MAX_INPUT_TOKENS:-32768}
  AGENT_MAX_OUTPUT_TOKENS: ${AGENT_MAX_OUTPUT_TOKENS:-8192}
  AGENT_MAX_TOTAL_TOKENS: ${AGENT_MAX_TOTAL_TOKENS:-40960}
  AGENT_MAX_CONCURRENT_RUNS_PER_USER: ${AGENT_MAX_CONCURRENT_RUNS_PER_USER:-2}
  AGENT_RUN_DEADLINE_MS: ${AGENT_RUN_DEADLINE_MS:-900000}
  RUN_HEARTBEAT_INTERVAL_MS: ${RUN_HEARTBEAT_INTERVAL_MS:-10000}
  RUN_RECOVERY_POLL_INTERVAL_MS: ${RUN_RECOVERY_POLL_INTERVAL_MS:-15000}
  DOCLING_BASE_URL: ${DOCLING_BASE_URL:-http://docling:5001}
  DOCLING_API_KEY: ${DOCLING_API_KEY:-development-docling-key}
  DOCLING_REQUEST_TIMEOUT_MS: ${DOCLING_REQUEST_TIMEOUT_MS:-310000}
  EXTRACTION_STALE_TIMEOUT_MS: ${EXTRACTION_STALE_TIMEOUT_MS:-360000}

services:
  postgres:
    image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [minio_data:/data]
    ports: ["9001:9001"]
    networks: [internal]

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do sleep 2; done
        mc mb --ignore-existing local/${MINIO_BUCKET}
        mc anonymous set none local/${MINIO_BUCKET}
    networks: [internal]

  qdrant:
    image: qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-local-development-qdrant-key-change-me}
    volumes: [qdrant_data:/qdrant/storage]
    networks: [internal]

  rabbitmq:
    image: rabbitmq:4.1.8-alpine@sha256:71afc2502e4ee983f72274b0292343d38e436d012a7835fbb605dce6f5b0bbd6
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.31.0@sha256:32ba1a1dded8d8fd21f9d8da1b9837e04cfee164ef891d9513174c3d989dcee9
    restart: unless-stopped
    environment:
      UVICORN_WORKERS: "1"
      DOCLING_DEVICE: cpu
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "1"
      DOCLING_SERVE_MAX_FILE_SIZE: "26214400"
      DOCLING_SERVE_MAX_SOURCES_PER_REQUEST: "1"
      DOCLING_SERVE_MAX_DOCUMENT_TIMEOUT: "300"
      DOCLING_SERVE_MAX_SYNC_WAIT: "300"
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: "false"
      DOCLING_SERVE_ALLOW_EXTERNAL_PLUGINS: "false"
      DOCLING_SERVE_API_KEY: ${DOCLING_API_KEY:-development-docling-key}
      DOCLING_SERVE_OTEL_ENABLE_METRICS: "false"
      DOCLING_SERVE_OTEL_ENABLE_TRACES: "false"
      DOCLING_SERVE_OTEL_ENABLE_PROMETHEUS: "false"
      DOCLING_SERVE_OTEL_ENABLE_OTLP_METRICS: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 60s
    networks: [internal]

  sandbox-runner:
    build: ./backend/sandbox-runner
    environment:
      SANDBOX_API_TOKEN: ${SANDBOX_API_TOKEN:-local-development-sandbox-token-change-me}
      SANDBOX_CONCURRENCY: 2
      SANDBOX_QUEUE_LIMIT: 32
      SANDBOX_TIMEOUT_MS: 30000
      SANDBOX_OUTPUT_LIMIT_BYTES: 262144
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [internal]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4100/ready').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  pdf-renderer:
    build: ./backend/pdf-renderer
    restart: unless-stopped
    environment:
      PDF_RENDERER_API_TOKEN: ${PDF_RENDERER_API_TOKEN:-local-development-pdf-renderer-token-change-me}
      PDF_RENDERER_CONCURRENCY: ${PDF_RENDERER_CONCURRENCY:-1}
      PDF_RENDER_TIMEOUT_MS: ${PDF_RENDER_TIMEOUT_MS:-30000}
      PDF_RENDER_MAX_SOURCE_BYTES: ${PDF_RENDER_MAX_SOURCE_BYTES:-26214400}
      PDF_RENDER_MAX_PAGES: ${PDF_RENDER_MAX_PAGES:-3}
      PDF_RENDER_MAX_DOCUMENT_PAGES: ${PDF_RENDER_MAX_DOCUMENT_PAGES:-1000}
      PDF_RENDER_DPI: ${PDF_RENDER_DPI:-144}
      PDF_RENDER_MAX_PIXELS_PER_PAGE: ${PDF_RENDER_MAX_PIXELS_PER_PAGE:-4000000}
      PDF_RENDER_MAX_TOTAL_BYTES: ${PDF_RENDER_MAX_TOTAL_BYTES:-10485760}
    networks: [internal]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m"]
    pids_limit: 64
    mem_limit: 384m
    cpus: 1
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4200/ready').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      qdrant: { condition: service_started }
    environment: *backend-env
    ports: ["4000:4000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  worker:
    build: ./backend
    command: ["sh", "-c", "npx --no-install prisma migrate deploy && npm run start:worker"]
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      qdrant: { condition: service_started }
      rabbitmq: { condition: service_healthy }
      sandbox-runner: { condition: service_healthy }
      pdf-renderer: { condition: service_healthy }
    environment: *backend-env
    extra_hosts: ["host.docker.internal:host-gateway"]
    # Development inference adapters are isolated to the execution worker.
    networks: [internal, development-egress]

  frontend:
    build: ./frontend
    depends_on: [backend]
    environment:
      BACKEND_INTERNAL_URL: http://backend:4000
    ports: ["3000:3000"]
    # The UI needs an ingress network so its published browser port works.
    # It has no direct credentials for internal data services.
    networks: [internal, edge]

networks:
  internal:
    internal: true
  development-egress: {}
  edge: {}

volumes:
  postgres_data:
  minio_data:
  qdrant_data:
  rabbitmq_data:
